[versions]
kotlin = "2.3.10"
kotlinx-coroutines-core = "1.10.2"
kotlinx-serialization = "1.10.0"
kotlinx-io-core = "0.8.2"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines-core" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-io-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-io-core", version.ref = "kotlinx-io-core" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[bundles]
puzzle-cli = ['kotlinx-coroutines-core']
puzzle-driver = ['kotlinx-coroutines-core', 'kotlinx-serialization-json']
puzzle-frontend = []
puzzle-sema = []
puzzle-backup = []
puzzle-diagnostic = ['kotlinx-serialization-json']
puzzle-builtin = []
puzzle-export = ['kotlinx-coroutines-core', 'kotlinx-serialization-json']
puzzle-core = ['kotlinx-serialization-json', 'kotlinx-io-core']

puzzle-config = ['kotlinx-serialization-json']
puzzle-token = ['kotlinx-serialization-json']
puzzle-ast = ['kotlinx-serialization-json']
puzzle-symbol = []
puzzle-ir = []